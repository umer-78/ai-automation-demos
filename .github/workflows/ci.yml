name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.demo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [demo-1-automation-hub, demo-2-sales-agent]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: ${{ matrix.demo }}/backend
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.demo }}/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Apply supabase/schema.sql twice (it must be idempotent)
        run: |
          # Supabase ships a storage schema; plain Postgres needs a stand-in for Demo 1's bucket insert.
          psql "$PG_URL" -v ON_ERROR_STOP=1 -c "create schema if not exists storage; create table if not exists storage.buckets (id text primary key, name text, public boolean);"
          psql "$PG_URL" -v ON_ERROR_STOP=1 -q -f ../supabase/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -q -f ../supabase/schema.sql
      - name: Tests on Postgres
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}

  frontend:
    name: Dashboard build (${{ matrix.demo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [demo-1-automation-hub, demo-2-sales-agent]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.demo }}/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
