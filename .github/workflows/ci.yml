name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [demo-1-automation-hub, demo-2-sales-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.demo }}/backend/requirements*.txt
      - name: Backend tests
        working-directory: ${{ matrix.demo }}/backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.demo }}/frontend/package-lock.json
      - name: Frontend type-check and build
        working-directory: ${{ matrix.demo }}/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
